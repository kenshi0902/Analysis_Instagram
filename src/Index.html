<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram ダッシュボード</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f6f4; --surface: #fcfcfb; --border: #e3e2dd;
    --text: #0b0b0b; --text2: #52514e; --muted: #8a897f; --grid: #e9e8e3;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --good: #1a7f4b; --bad: #c4332f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #121211; --surface: #1a1a19; --border: #2e2e2b;
      --text: #f0efec; --text2: #c3c2b7; --muted: #8f8e84; --grid: #2b2b28;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --good: #4cc38a; --bad: #ef7d79;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  .meta { color: var(--muted); font-size: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .bar .lbl { color: var(--muted); font-size: 12px; margin-right: 4px; }
  button { font: inherit; color: var(--text2); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 11px; cursor: pointer; }
  button[aria-pressed="true"] { color: var(--text); border-color: var(--s1); box-shadow: inset 0 -2px 0 var(--s1); }
  .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .subbar { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; }
  .note { color: var(--muted); font-size: 12px; margin: -4px 0 12px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .kpi .label { color: var(--text2); font-size: 12px; }
  .kpi .value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .delta { font-size: 12px; color: var(--muted); }
  .kpi .delta.up { color: var(--good); } .kpi .delta.down { color: var(--bad); }
  .kpi .sub { color: var(--muted); font-size: 11px; }
  .kpi.primary { border-color: var(--s1); }
  .weak .value { opacity: .5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .card h2 { font-size: 14px; margin: 0 0 2px; }
  .card .desc { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .chart { position: relative; height: 240px; }
  .table-wrap { overflow-x: auto; max-height: 560px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; font-variant-numeric: tabular-nums; }
  th { color: var(--text2); font-weight: 500; position: sticky; top: 0; background: var(--surface); z-index: 1; }
  th[data-sort] { cursor: pointer; user-select: none; }
  th.l, td.l { text-align: left; }
  td.cap { text-align: left; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  td a { color: var(--s1); }
  .thumb { width: 32px; height: 32px; object-fit: cover; border-radius: 6px; vertical-align: middle; margin-right: 8px; background: var(--grid); }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--border); color: var(--text2); }
  .badge.top { border-color: var(--s1); color: var(--text); }
  .badge.pending { color: var(--muted); border-style: dashed; }
  .funnel .step { margin: 10px 0; }
  .funnel .row { display: flex; justify-content: space-between; font-size: 13px; }
  .funnel .track { height: 10px; background: var(--grid); border-radius: 5px; overflow: hidden; margin-top: 4px; }
  .funnel .fill { height: 100%; background: var(--s1); border-radius: 5px; min-width: 3px; }
  .funnel .conv { color: var(--muted); font-size: 12px; text-align: center; margin: 2px 0; }
  .heat td { text-align: center; min-width: 64px; padding: 8px 4px; border: 2px solid var(--surface); border-radius: 6px; font-size: 12px; }
  .heat td.h { background: none; color: var(--text2); text-align: right; }
  .heat td .n { display: block; font-size: 10px; opacity: .75; }
  .heat td.low { color: var(--muted); background: var(--grid); }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  #status { color: var(--muted); padding: 40px 0; text-align: center; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Instagram ダッシュボード</h1>
      <div class="meta" id="fresh"></div>
    </div>
    <button id="reload" type="button">再読み込み</button>
  </header>

  <div id="status">読み込み中…</div>

  <div id="app" class="hidden">
    <div class="toolbar">
      <div class="bar" id="tabs" role="tablist"></div>
      <div class="bar" id="range"></div>
    </div>
    <div id="view"></div>
  </div>
</div>

<script>
/* ===================== 設定 ===================== */
const TABS = [
  { id: 'overview', label: '概要' },
  { id: 'posts', label: '投稿(フィード・リール)' },
  { id: 'stories', label: 'ストーリーズ' },
  { id: 'audience', label: 'オーディエンス' },
];
const RANGES = [{ v: 7, l: '7日' }, { v: 30, l: '30日' }, { v: 90, l: '90日' }, { v: 0, l: '全期間' }];
const MIN_N = 5; // これ未満のサンプル数は参考値として薄く表示する
const state = { tab: 'overview', days: 30, gran: 'day', fmt: 'all', point: 'cur', heat: 'reachRate', sort: {} };
let DATA = null, P = null, charts = [];

/* ===================== ユーティリティ ===================== */
const DAY = 86400000;
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const num = (v) => (v === '' || v === null || v === undefined || isNaN(Number(v)) ? null : Number(v));
const div = (a, b) => (a == null || b == null || !b ? null : a / b);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (v, d) => (v == null || !isFinite(v) ? '–' : Number(v).toLocaleString('ja-JP', { maximumFractionDigits: d == null ? 0 : d }));
const pct = (v) => (v == null || !isFinite(v) ? '–' : (v * 100).toFixed(Math.abs(v) < 0.01 ? 2 : 1) + '%');
const pct100 = (v) => (v == null ? null : +(v * 100).toFixed(3));
const sumOf = (rows, k) => (rows.some((r) => r[k] != null) ? rows.reduce((a, r) => a + (r[k] || 0), 0) : null);
const median = (arr) => {
  const a = arr.filter((v) => v != null && isFinite(v)).sort((x, y) => x - y);
  if (!a.length) return null;
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
};
const quantile = (arr, q) => {
  const a = arr.filter((v) => v != null && isFinite(v)).sort((x, y) => x - y);
  if (!a.length) return null;
  const pos = (a.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
  return a[lo] + (a[hi] - a[lo]) * (pos - lo);
};
const nOf = (arr) => arr.filter((v) => v != null && isFinite(v)).length;
const jstToday = () => new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
const addDays = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * DAY).toISOString().slice(0, 10);
const d10 = (v) => String(v == null ? '' : v).slice(0, 10);
const parseTs = (s) => new Date(String(s).slice(0, 16).replace(' ', 'T') + ':00+09:00');
const jstParts = (t) => { const j = new Date(t.getTime() + 9 * 3600000); return { dow: j.getUTCDay(), hour: j.getUTCHours() }; };

/**
 * 期間ウィンドウ [from, to)。shift=1 で直前の同じ長さの期間。
 * アカウント日次は前日までしか無いので today を含めない(includeToday=false)。投稿・ストーリーは今日を含める。
 */
function win(days, shift, includeToday) {
  const end = includeToday ? addDays(jstToday(), 1) : jstToday();
  if (!days) return shift ? null : { from: '0000-00-00', to: end };
  return { from: addDays(end, -days * (shift + 1)), to: addDays(end, -days * shift) };
}
const inWin = (d, w) => !!w && d >= w.from && d < w.to;

/* ===================== データ整形 ===================== */
function prepare(d) {
  const fol = d.followers
    .map((r) => ({ date: d10(r['日付']), count: num(r['フォロワー数']), est: r['種別'] === '推定' }))
    .filter((r) => r.count != null).sort((a, b) => a.date.localeCompare(b.date));
  // 指定日のフォロワー数(記録範囲外は null。範囲外を近似すると古い投稿のリーチ率が歪むため)
  const folAt = (date) => {
    if (!fol.length || date < fol[0].date) return null;
    let v = null;
    for (const r of fol) { if (r.date <= date) v = r.count; else break; }
    return v;
  };

  const daily = d.accountDaily.map((r) => ({
    date: d10(r['日付']), reach: num(r['リーチ']), views: num(r['閲覧数']), engaged: num(r['エンゲージしたアカウント']),
    inter: num(r['インタラクション合計']), likes: num(r['いいね']), comments: num(r['コメント']), saves: num(r['保存']),
    shares: num(r['シェア']), pv: num(r['プロフィール訪問']), follows: num(r['フォロー増']), unfollows: num(r['フォロー解除']),
  })).sort((a, b) => a.date.localeCompare(b.date));

  const periods = {};
  d.accountPeriod.forEach((r) => {
    periods[r['期間キー']] = {
      key: String(r['期間キー']), unit: r['粒度'], from: d10(r['開始日']), to: d10(r['終了日']),
      reach: num(r['リーチ']), engaged: num(r['エンゲージしたアカウント']), state: r['状態'] || '',
    };
  });

  const metricsOf = (r) => ({
    views: num(r['閲覧数']), reach: num(r['リーチ']), likes: num(r['いいね']), comments: num(r['コメント']),
    saved: num(r['保存']), shares: num(r['シェア']), inter: num(r['インタラクション合計']),
    follows: num(r['フォロー']), pv: num(r['プロフィール訪問']), watch: num(r['平均視聴時間(秒)']),
  });
  // メディアIDはキー列(文字列)から取り出す。数値列だと18桁のIDが丸められるため。
  const snaps = {};
  d.mediaSnapshots.forEach((r) => {
    const [id, day] = String(r['キー']).split('|');
    (snaps[id] = snaps[id] || {})[day] = metricsOf(r);
  });
  const now = Date.now();
  const post = (r, type) => {
    const t = parseTs(r['投稿日時']), p = jstParts(t), id = String(r['メディアID']);
    return {
      id, type, ts: String(r['投稿日時']).slice(0, 16), date: d10(r['投稿日時']), dow: p.dow, hour: p.hour,
      ageDays: (now - t.getTime()) / DAY, caption: r['キャプション'] || '', thumb: r['サムネイルURL'] || '', url: r['URL'] || '',
      cur: metricsOf(r), snaps: snaps[id] || {}, followers: folAt(d10(r['投稿日時'])),
    };
  };
  const posts = d.feed.map((r) => post(r, 'フィード')).concat(d.reels.map((r) => post(r, 'リール')));

  // ストーリーズは「同じ日の連続投稿」を1シーケンスとして扱う
  const byDay = {};
  d.stories.forEach((r) => {
    const s = {
      id: String(r['ストーリーID']), ts: String(r['投稿日時']).slice(0, 16), date: d10(r['投稿日時']), url: r['URL'] || '',
      views: num(r['閲覧数']), reach: num(r['リーチ']), replies: num(r['返信']), shares: num(r['シェア']),
      follows: num(r['フォロー']), pv: num(r['プロフィール訪問']),
      next: num(r['次へ']), back: num(r['戻る']), exit: num(r['終了']), swipe: num(r['次のアカウントへ']),
    };
    (byDay[s.date] = byDay[s.date] || []).push(s);
  });
  const storyDays = Object.keys(byDay).sort().map((date) => {
    const items = byDay[date].sort((a, b) => a.ts.localeCompare(b.ts));
    const first = items[0], last = items[items.length - 1];
    items.forEach((s, i) => {
      s.pos = i + 1;
      s.retention = div(s.reach, first.reach);
      s.exitRate = div(s.exit, s.views);
      s.backRate = div(s.back, s.views);
      s.replyRate = div(s.replies, s.reach);
    });
    const followers = folAt(date);
    return {
      date, items, count: items.length, firstReach: first.reach, firstReachRate: div(first.reach, followers),
      completion: items.length >= 2 ? div(last.reach, first.reach) : null, firstExit: first.exitRate,
    };
  });

  const latest = (rows) => rows.reduce((m, r) => (String(r['取得日時'] || '') > m ? String(r['取得日時']) : m), '');
  const fresh = [
    ['フォロワー', latest(d.followers)], ['投稿', latest(d.feed.concat(d.reels))], ['ストーリー', latest(d.stories)],
    ['アカウント', latest(d.accountDaily)], ['期間リーチ', latest(d.accountPeriod)], ['属性', latest(d.audience)],
  ];
  return { fol, folAt, daily, periods, posts, storyDays, audience: d.audience, fresh };
}

/* ===================== 読み込み・描画の骨組み ===================== */
function load() {
  const st = document.getElementById('status');
  st.textContent = '読み込み中…';
  st.classList.remove('hidden');
  google.script.run
    .withSuccessHandler((d) => {
      DATA = d;
      P = prepare(d);
      st.classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('fresh').textContent = '最終取得 ― ' +
        P.fresh.map(([k, v]) => k + ' ' + (v ? v.slice(5, 16) : '未取得')).join(' / ');
      render();
    })
    .withFailureHandler((e) => { st.textContent = '読み込みに失敗しました: ' + (e && e.message ? e.message : e); })
    .getDashboardData();
}

function seg(key, options, label) {
  return `<div class="bar">${label ? `<span class="lbl">${esc(label)}</span>` : ''}${options.map((o) =>
    `<button type="button" data-k="${key}" data-v="${o.v}" aria-pressed="${String(state[key]) === String(o.v)}">${esc(o.l)}</button>`).join('')}</div>`;
}

function render() {
  charts.forEach((c) => c.destroy());
  charts = [];
  document.getElementById('tabs').innerHTML = TABS.map((t) =>
    `<button type="button" role="tab" data-tab="${t.id}" aria-pressed="${state.tab === t.id}">${t.label}</button>`).join('');
  const range = document.getElementById('range');
  range.innerHTML = seg('days', RANGES, '期間');
  range.classList.toggle('hidden', state.tab === 'audience');
  const v = document.getElementById('view');
  ({ overview, posts, stories, audience })[state.tab](v);
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return; state.tab = b.dataset.tab; render();
});
document.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-k]');
  if (b) { const cur = state[b.dataset.k]; state[b.dataset.k] = typeof cur === 'number' ? Number(b.dataset.v) : b.dataset.v; render(); return; }
  const th = e.target.closest('th[data-sort]');
  if (th) {
    const [key, k] = th.dataset.sort.split('|');
    const cur = state.sort[key] || {};
    state.sort[key] = { k, dir: cur.k === k ? -cur.dir : -1 };
    render();
  }
});
document.getElementById('reload').addEventListener('click', load);

/* ===================== 部品 ===================== */
/** kind: 'rate' は差をpt、'count' は変化率で前期間比を出す */
function deltaHtml(cur, prev, kind) {
  if (prev === undefined) return '';
  if (cur == null || prev == null || (kind !== 'rate' && !prev)) return '<div class="delta">前期間比 –</div>';
  let d, txt;
  if (kind === 'rate') { d = (cur - prev) * 100; txt = (d > 0 ? '+' : '') + d.toFixed(Math.abs(d) < 0.1 ? 2 : 1) + 'pt'; }
  else { d = (cur - prev) / prev; txt = (d > 0 ? '+' : '') + (d * 100).toFixed(1) + '%'; }
  const cls = d > 0 ? 'up' : d < 0 ? 'down' : '';
  return `<div class="delta ${cls}">${d > 0 ? '▲' : d < 0 ? '▼' : '±'} ${txt} <span style="color:var(--muted)">前期間比</span></div>`;
}
/** o: { label, value, kind, prev, sub, n, primary } */
function kpi(o) {
  const v = o.kind === 'rate' ? pct(o.value) : fmt(o.value, o.digits);
  const weak = o.n != null && o.n < MIN_N;
  const sub = [o.sub, o.n != null ? 'n=' + o.n + (weak ? '(少)' : '') : ''].filter(Boolean).join(' · ');
  return `<div class="card kpi${o.primary ? ' primary' : ''}${weak ? ' weak' : ''}"><div class="label">${esc(o.label)}</div>` +
    `<div class="value">${v}</div>${deltaHtml(o.value, o.prev, o.kind)}${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>`;
}
function card(id, title, desc, cls) {
  return `<div class="card ${cls || ''}"><h2>${esc(title)}</h2><div class="desc">${esc(desc || '')}</div><div class="chart"><canvas id="${id}"></canvas></div></div>`;
}
const colors = () => [css('--s1'), css('--s2'), css('--s3'), css('--s4')];
const legend = (show) => ({ display: show, labels: { color: css('--text2'), usePointStyle: true, boxWidth: 8 } });
function scales(o) {
  o = o || {};
  const t = css('--text2'), g = css('--grid');
  const x = { ticks: { color: t, maxTicksLimit: o.xTicks || 8 }, grid: { display: !!o.xGrid, color: g } };
  const y = { ticks: { color: t }, grid: { color: g }, beginAtZero: o.zero !== false };
  if (o.xType) x.type = o.xType;
  if (o.xFmt) x.ticks.callback = o.xFmt;
  if (o.yFmt) y.ticks.callback = o.yFmt;
  if (o.yMax != null) y.max = o.yMax;
  if (o.stacked) { x.stacked = true; y.stacked = true; }
  if (o.xTitle) x.title = { display: true, text: o.xTitle, color: t };
  if (o.yTitle) y.title = { display: true, text: o.yTitle, color: t };
  if (o.horizontal) return { x: Object.assign(y, { beginAtZero: true }), y: Object.assign(x, { grid: { display: false } }) };
  return { x, y };
}
const pctTick = (v) => v + '%';
const pctLabel = (c) => `${c.dataset.label}: ${c.parsed[c.chart.options.indexAxis === 'y' ? 'x' : 'y'] == null ? '–' : (+c.parsed[c.chart.options.indexAxis === 'y' ? 'x' : 'y']).toFixed(2) + '%'}`;
function mk(id, config) {
  const el = document.getElementById(id);
  if (el) charts.push(new Chart(el, config));
}
function lineDs(label, data, i, extra) {
  const c = colors()[i];
  return Object.assign({ label, data, borderColor: c, backgroundColor: c, borderWidth: 2, pointRadius: data.length > 40 ? 0 : 3, pointHoverRadius: 5, tension: 0.2, spanGaps: true }, extra || {});
}
function barDs(label, data, i, extra) {
  return Object.assign({ label, data, backgroundColor: colors()[i], borderRadius: 4, maxBarThickness: 28, borderColor: css('--surface'), borderWidth: 1 }, extra || {});
}
const baseOpts = (o) => Object.assign({ responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false } }, o);

/** 散布図に中央値の十字線を引く */
const medianLines = {
  id: 'medianLines',
  afterDatasetsDraw(chart, args, opts) {
    const { ctx, chartArea: a, scales: s } = chart;
    ctx.save();
    ctx.strokeStyle = opts.color; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    if (opts.x != null && opts.x > 0) { const px = s.x.getPixelForValue(opts.x); ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke(); }
    if (opts.y != null) { const py = s.y.getPixelForValue(opts.y); ctx.beginPath(); ctx.moveTo(a.left, py); ctx.lineTo(a.right, py); ctx.stroke(); }
    ctx.restore();
  },
};

/** 並べ替え可能な表。cols: { k, l, type: 'rate'|'count'|'text', f, cls } */
function table(rows, cols, key, def) {
  if (!rows.length) return '<div class="empty">データがありません</div>';
  const s = state.sort[key] || def;
  const sorted = rows.slice().sort((a, b) => {
    const x = a[s.k], y = b[s.k];
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y))) * s.dir;
  }).slice(0, 300);
  const head = cols.map((c) => `<th class="${c.type === 'text' ? 'l' : ''}"${c.k ? ` data-sort="${key}|${c.k}"` : ''}>${esc(c.l)}${s.k === c.k ? (s.dir < 0 ? ' ▼' : ' ▲') : ''}</th>`).join('');
  const body = sorted.map((r) => '<tr>' + cols.map((c) => {
    const v = c.f ? c.f(r) : c.type === 'rate' ? pct(r[c.k]) : c.type === 'text' ? esc(r[c.k]) : fmt(r[c.k], c.digits);
    return `<td class="${c.cls || (c.type === 'text' ? 'l' : '')}">${v}</td>`;
  }).join('') + '</tr>').join('');
  return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>` +
    (rows.length > 300 ? `<div class="note" style="margin-top:8px">上位300件を表示(全${rows.length}件)</div>` : '');
}

const mediaCell = (r) => `${r.thumb ? `<img class="thumb" src="${esc(r.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}${esc(String(r.caption).slice(0, 36)) || '(キャプションなし)'}`;

/** アカウントの期間集計。7日・30日は期間ユニークリーチ、それ以外は確定済みの週ユニークの平均で扱う。 */
function accStats(days, shift) {
  const w = win(days, shift, false);
  if (!w) return null;
  const rows = P.daily.filter((r) => inWin(r.date, w));
  let reach = null, rateReach = null, rateRows = rows, label, sub;
  if (days === 7 || days === 30) {
    const p = P.periods['R' + days + (shift ? '前' : '')];
    if (p) { reach = p.reach; rateReach = p.reach; }
    label = `期間リーチ(${days}日)`;
    sub = 'ユニーク数';
  } else {
    const weeks = Object.values(P.periods).filter((p) => p.unit === '週' && p.state === '確定' && p.from >= w.from && addDays(p.to, 1) <= w.to);
    if (weeks.length) {
      rateReach = weeks.reduce((a, p) => a + (p.reach || 0), 0);
      reach = rateReach / weeks.length;
      rateRows = P.daily.filter((r) => weeks.some((p) => r.date >= p.from && r.date <= p.to));
    }
    label = '週平均リーチ';
    sub = `ユニーク数・${weeks.length}週の平均`;
  }
  const fStart = P.folAt(w.from);
  const fEnd = shift ? P.folAt(w.to) : (P.fol.length ? P.fol[P.fol.length - 1].count : null);
  const est = P.fol.some((r) => r.est && r.date >= w.from && r.date <= w.to);
  return {
    w, dayCount: rows.length, reach, label, sub,
    reachRate: div(reach, fStart),
    shareRate: div(sumOf(rateRows, 'shares'), rateReach),
    er: div(sumOf(rateRows, 'inter'), rateReach),
    pvRate: div(sumOf(rateRows, 'pv'), rateReach),
    followConv: div(sumOf(rows, 'follows'), sumOf(rows, 'pv')),
    pv: sumOf(rows, 'pv'), follows: sumOf(rows, 'follows'), unfollows: sumOf(rows, 'unfollows'),
    fStart, fEnd, growth: fStart != null && fEnd != null ? div(fEnd - fStart, fStart) : null, est,
  };
}

/** 推移グラフ用のバケット。日はその日のユニーク、週・月は期間ユニーク(日次の合計ではない)。 */
function accBuckets() {
  const w = win(state.days, 0, false);
  if (state.gran === 'day') {
    return P.daily.filter((r) => inWin(r.date, w)).map((r) => Object.assign({ label: r.date.slice(5), state: '' }, r));
  }
  const unit = state.gran === 'week' ? '週' : '月';
  return Object.values(P.periods)
    .filter((p) => p.unit === unit && addDays(p.to, 1) > w.from)
    .sort((a, b) => a.from.localeCompare(b.from))
    .map((p) => {
      const rows = P.daily.filter((r) => r.date >= p.from && r.date <= p.to);
      const expected = Math.round((Date.parse(p.to) - Date.parse(p.from)) / DAY) + 1;
      const full = rows.length >= expected; // 日次が揃っていない期間は率を出さない
      const s = (k) => (full ? sumOf(rows, k) : null);
      return {
        label: unit === '週' ? p.from.slice(5) + '週' : p.key.slice(2), state: p.state,
        reach: p.reach, inter: s('inter'), likes: s('likes'), saves: s('saves'), shares: s('shares'),
      };
    });
}

  mk('o_er', {

function funnelHtml(s) {
  const steps = [
    { l: 'リーチ', v: s.reach }, { l: 'プロフィール訪問', v: s.pv }, { l: 'フォロー', v: s.follows },
  ];
  const max = steps[0].v || Math.max(...steps.map((x) => x.v || 0)) || 1;
  const convs = [pct(div(s.pv, s.reach)), pct(div(s.follows, s.pv))];
  return steps.map((x, i) =>
    `<div class="step"><div class="row"><span>${x.l}</span><strong>${fmt(x.v)}</strong></div>` +
    `<div class="track"><div class="fill" style="width:${Math.max(0.5, Math.min(100, ((x.v || 0) / max) * 100))}%"></div></div></div>` +
    (i < 2 ? `<div class="conv">↓ ${convs[i]}</div>` : '')).join('') +
    `<div class="desc" style="margin-top:8px">フォロー解除 ${fmt(s.unfollows)}${state.days !== 7 && state.days !== 30 ? '・リーチは週平均のため転換率は参考値' : ''}</div>`;
}

function postRates(m, f) {
  return {
    reach: m.reach, views: m.views, follows: m.follows, watch: m.watch,
    reachRate: div(m.reach, f), er: div(m.inter, m.reach), erF: div(m.inter, f),

}
/** 選択中の形式・評価時点で投稿を集める。stat=false の行は表には出すが中央値から除く(経過日数が足りない)。 */
function postSet(w) {
  const rows = [];
  let pending = 0, missing = 0;
  P.posts.filter((p) => inWin(p.date, w) && (state.fmt === 'all' || p.type === state.fmt)).forEach((p) => {
    let m, stat = true;
    if (state.point === 'cur') {
      m = p.cur;
      if (p.ageDays < 7) { stat = false; pending++; }
    } else {
      m = p.snaps[state.point];
      if (!m) { if (p.ageDays < Number(state.point) + 1) pending++; else missing++; return; }
    }
    rows.push(Object.assign({}, p, postRates(m, p.followers), { stat }));
  });
  return { rows, stats: rows.filter((r) => r.stat), pending, missing };
}
const POST_KPIS = [

const DOWS = [[1, '月'], [2, '火'], [3, '水'], [4, '木'], [5, '金'], [6, '土'], [0, '日']];
const HOURS = [[0, 6, '0-6時'], [6, 9, '6-9時'], [9, 12, '9-12時'], [12, 15, '12-15時'], [15, 18, '15-18時'], [18, 21, '18-21時'], [21, 24, '21-24時']];
function heatmap(rows, k) {
  const cells = DOWS.map(([d]) => HOURS.map(([h0, h1]) => {
    const vals = rows.filter((r) => r.dow === d && r.hour >= h0 && r.hour < h1).map((r) => r[k]);
    return { v: median(vals), n: nOf(vals) };
  }));
  const valid = cells.flat().filter((c) => c.n >= 2 && c.v != null).map((c) => c.v);
  if (!valid.length) return '<div class="empty">比較できるセルがありません(各セル2件以上が必要)</div>';
  const lo = Math.min(...valid), hi = Math.max(...valid);
  const head = '<tr><td class="h"></td>' + HOURS.map((h) => `<td class="h" style="text-align:center">${h[2]}</td>`).join('') + '</tr>';
  const body = DOWS.map(([, name], i) => '<tr><td class="h">' + name + '</td>' + cells[i].map((c, j) => {
    const title = `${name} ${HOURS[j][2]}: 中央値 ${pct(c.v)} / ${c.n}件`;
    if (c.n < 2 || c.v == null) return `<td class="low" title="${esc(title)}">${c.n ? pct(c.v) : '–'}<span class="n">${c.n}件</span></td>`;
    const t = hi > lo ? (c.v - lo) / (hi - lo) : 0.5;
    const strong = t > 0.55;
    return `<td title="${esc(title)}" style="background:color-mix(in oklab, var(--s1) ${Math.round(10 + t * 75)}%, var(--surface));color:${strong ? '#fff' : 'var(--text)'}">${pct(c.v)}<span class="n">${c.n}件</span></td>`;
  }).join('') + '</tr>').join('');
  return `<div class="table-wrap"><table class="heat">${head}${body}</table></div>`;
}

function postTable(cur) {
  const q75 = quantile(cur.stats.map((r) => r.reachRate), 0.75), q25 = quantile(cur.stats.map((r) => r.reachRate), 0.25);
  const rows = cur.rows.map((r) => Object.assign({}, r, {

    age: Math.floor(r.ageDays),

function stories(v) {
  const w = win(state.days, 0, true), pw = state.days ? win(state.days, 1, true) : null;
  const cur = storyStats(w), prev = pw ? storyStats(pw) : null;
  const kp =(label, f, kind, sub, primary, fromItems) => {
    const vals = fromItems ? cur.items.map(f) : cur.days.map(f);
    const pvv = prev ? median(fromItems ? prev.items.map(f) : prev.days.map(f)) : undefined;
    return kpi({ label, value: median(vals), kind, prev: pvv, sub, n: nOf(vals), primary });
  };
  v.innerHTML = `
    <div class="note">1日の連続投稿を1シーケンスとして集計。完走率 = 最後のリーチ ÷ 1枚目のリーチ、離脱率 = 終了 ÷ 閲覧(1枚目は構造的に高くなるため位置別に比較)。</div>
    <div class="kpis">
      ${kpi({ label: '投稿日数', value: cur.days.length, kind: 'count', prev: prev ? prev.days.length : undefined, sub: `合計 ${cur.items.length}枚・1日平均 ${fmt(div(cur.items.length, cur.days.length), 1)}枚` })}
      ${kp('1枚目リーチ 中央値', (d) => d.firstReach, 'count', 'ユニーク数', true)}
      ${kp('1枚目リーチ率 中央値', (d) => d.firstReachRate, 'rate', '1枚目リーチ ÷ フォロワー', true)}
      ${kp('完走率 中央値', (d) => d.completion, 'rate', '2枚以上の日のみ')}
      ${kp('1枚目離脱率 中央値', (d) => d.firstExit, 'rate', '終了 ÷ 閲覧')}
      ${kp('返信率 中央値', (s) => s.replyRate, 'rate', '返信 ÷ リーチ(全ストーリー)', false, true)}
    </div>
    <div class="grid">
      ${card('s_ret', '何枚目まで残るか(残存率)', '1枚目のリーチを100%とした各位置のリーチ(中央値)')}
      ${card('s_exit', '何枚目で離脱するか(離脱率)', '位置ごとの 終了 ÷ 閲覧(中央値)')}
      ${card('s_reach', '日ごとの1枚目リーチ', '')}
      ${card('s_comp', '日ごとの完走率', '2枚以上の日のみ')}
      ${card('s_nav', 'タップ操作の構成比', '日ごとの 次へ / 戻る / 終了 / 次のアカウントへ の割合')}
    </div>
    <div class="card"><h2>ストーリー一覧</h2>${table(cur.items.map((s) => Object.assign({}, s)), [
      { k: 'ts', l: '投稿日時', type: 'text' },
      { k: 'pos', l: '枚目' },
      { k: 'views', l: '閲覧' },
      { k: 'reach', l: 'リーチ' },
      { k: 'retention', l: '残存率', type: 'rate' },
      { k: 'exitRate', l: '離脱率', type: 'rate' },
      { k: 'backRate', l: '戻る率', type: 'rate' },
      { k: 'replies', l: '返信' },
      { k: 'shares', l: 'シェア' },
      { k: 'pv', l: 'プロフ訪問' },
      { k: 'follows', l: 'フォロー' },
      { k: '', l: '', f: linkCell },
    ], 'stories', { k: 'ts', dir: -1 })}</div>`;

  // 位置別(最大10枚目)
  const maxPos = Math.min(10, Math.max(0, ...cur.days.map((d) => d.count)));
  const pos = Array.from({ length: maxPos }, (_, i) => i + 1);
  const at = (p, k) => cur.items.filter((s) => s.pos === p).map((s) => s[k]);
  const nTip = (k) => ({ callbacks: { label: pctLabel, afterLabel: (c) => 'n=' + nOf(at(c.dataIndex + 1, k)) } });
  mk('s_ret', {
    type: 'line',
    data: { labels: pos.map((p) => p + '枚目'), datasets: [lineDs('残存率', pos.map((p) => pct100(median(at(p, 'retention')))), 0)] },
    options: baseOpts({ scales: scales({ yFmt: pctTick, yMax: 100 }), plugins: { legend: legend(false), tooltip: nTip('retention') } }),
  });
  mk('s_exit', {
    type: 'bar',
    data: { labels: pos.map((p) => p + '枚目'), datasets: [barDs('離脱率', pos.map((p) => pct100(median(at(p, 'exitRate')))), 0)] },
    options: baseOpts({ scales: scales({ yFmt: pctTick }), plugins: { legend: legend(false), tooltip: nTip('exitRate') } }),
  });
  const D = cur.days;
  mk('s_reach', {
    type: 'bar',
    data: { labels: D.map((d) => d.date.slice(5)), datasets: [barDs('1枚目リーチ', D.map((d) => d.firstReach), 0)] },
    options: baseOpts({ scales: scales(), plugins: { legend: legend(false), tooltip: { callbacks: { afterLabel: (c) => D[c.dataIndex].count + '枚投稿' } } } }),
  });
  mk('s_comp', {
    type: 'line',
    data: { labels: D.map((d) => d.date.slice(5)), datasets: [lineDs('完走率', D.map((d) => pct100(d.completion)), 0)] },
    options: baseOpts({ scales: scales({ yFmt: pctTick, yMax: 100 }), plugins: { legend: legend(false), tooltip: { callbacks: { label: pctLabel } } } }),
  });
  const navKeys = [['next', '次へ'], ['back', '戻る'], ['exit', '終了'], ['swipe', '次のアカウントへ']];
  const share = (d, k) => {
    const tot = navKeys.reduce((a, [kk]) => a + (sumOf(d.items, kk) || 0), 0);
    return tot ? pct100((sumOf(d.items, k) || 0) / tot) : null;
  };
  mk('s_nav', {
    type: 'bar',
    data: { labels: D.map((d) => d.date.slice(5)), datasets: navKeys.map(([k, l], i) => barDs(l, D.map((d) => share(d, k)), i, { borderRadius: 0, borderWidth: 2 })) },
    options: baseOpts({ scales: scales({ stacked: true, yFmt: pctTick, yMax: 100 }), plugins: { legend: legend(true), tooltip: { callbacks: { label: pctLabel } } } }),
  });
}

/* ===================== オーディエンス ===================== */
const TARGETS = ['フォロワー', 'リーチしたオーディエンス', 'エンゲージしたオーディエンス'];
const TARGET_SHORT = { 'フォロワー': 'フォロワー', 'リーチしたオーディエンス': 'リーチ層', 'エンゲージしたオーディエンス': 'エンゲージ層' };
const GENDER = { F: '女性', M: '男性', U: '不明' };
/** 区分ごとに { items:[項目], share: { 対象: { 項目: 構成比 } } } を作る。都市・国は上位10+その他。 */
function composition(kind) {
  const rows = P.audience.filter((r) => r['区分'] === kind);
  const share = {};
  TARGETS.forEach((t) => {
    const rs = rows.filter((r) => r['対象'] === t);
    const tot = rs.reduce((a, r) => a + (num(r['人数']) || 0), 0);
    share[t] = {};
    rs.forEach((r) => { share[t][r['項目']] = tot ? (num(r['人数']) || 0) / tot : null; });
  });
  let items = Array.from(new Set(rows.map((r) => r['項目'])));
  const base = share['フォロワー'];
  if (kind === '年齢層') items.sort((a, b) => (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0));
  else if (kind === '性別') items.sort((a, b) => ['F', 'M', 'U'].indexOf(a) - ['F', 'M', 'U'].indexOf(b));
  else {
    items.sort((a, b) => (base[b] || 0) - (base[a] || 0));
    if (items.length > 10) {
      const top = items.slice(0, 10);
      TARGETS.forEach((t) => {
        const other = Object.keys(share[t]).filter((k) => top.indexOf(k) === -1).reduce((a, k) => a + (share[t][k] || 0), 0);
        share[t]['その他'] = other;
      });
      items = top.concat(['その他']);
    }
  }
  return { items, share };
}

function audience(v) {
  if (!P.audience.length) {
    v.innerHTML = '<div class="card empty">オーディエンスのデータがありません。syncAudience を実行してください(フォロワー100人以上が必要)。</div>';
    return;
  }
  const kinds = ['年齢層', '性別', '都市', '国'];
  const comp = {};
  kinds.forEach((k) => { comp[k] = composition(k); });
  v.innerHTML = `
    <div class="note">人数ではなく構成比(%)で、フォロワー・リーチ層・エンゲージ層を並べて比較。リーチ層・エンゲージ層は今月の集計です。</div>
    <div class="grid">
      ${card('a_age', '年齢層の構成比', '')}
      ${card('a_gender', '性別の構成比', '')}
    </div>
    <div class="card" style="margin-bottom:12px"><h2>反応指数</h2>
      <div class="desc">各層の構成比 ÷ フォロワーの構成比。1.2以上(▲)はフォロワー比で特に届いている/反応している層、0.8以下(▼)は弱い層。</div>
      ${indexTable(comp)}
    </div>
    <div class="grid">
      ${card('a_city', '都市の構成比', 'フォロワー上位10+その他')}
      ${card('a_country', '国の構成比', 'フォロワー上位10+その他')}
    </div>`;
  const draw = (id, kind, horizontal) => {
    const c = comp[kind];
    const label = (x) => (kind === '性別' ? GENDER[x] || x : x);
    mk(id, {
      type: 'bar',
      data: { labels: c.items.map(label), datasets: TARGETS.map((t, i) => barDs(TARGET_SHORT[t], c.items.map((x) => pct100(c.share[t][x])), i)) },
      options: baseOpts({
        indexAxis: horizontal ? 'y' : 'x',
        scales: horizontal ? scales({ horizontal: true, yFmt: pctTick }) : scales({ yFmt: pctTick }),
        plugins: { legend: legend(true), tooltip: { callbacks: { label: pctLabel } } },
      }),
    });
  };
  draw('a_age', '年齢層');
  draw('a_gender', '性別');
  draw('a_city', '都市', true);
  draw('a_country', '国', true);
  // 横棒は項目数に応じて高さを確保する
  ['a_city', 'a_country'].forEach((id) => { const el = document.getElementById(id); if (el) el.parentElement.style.height = '380px'; });
  charts.forEach((ch) => ch.resize());
}

function indexTable(comp) {
  const mark = (x) => (x == null ? '–' : x.toFixed(2) + (x >= 1.2 ? ' ▲' : x <= 0.8 ? ' ▼' : ''));
  const rows = [];
  ['年齢層', '性別'].forEach((kind) => {
    const c = comp[kind];
    c.items.forEach((it) => {
      const f = c.share['フォロワー'][it], r = c.share['リーチしたオーディエンス'][it], e = c.share['エンゲージしたオーディエンス'][it];
      rows.push({ kind, item: kind === '性別' ? GENDER[it] || it : it, f, r, e, ri: div(r, f), ei: div(e, f) });
    });
  });
  return `<div class="table-wrap"><table><thead><tr><th class="l">区分</th><th class="l">項目</th><th>フォロワー</th><th>リーチ層</th><th>エンゲージ層</th><th>リーチ指数</th><th>反応指数</th></tr></thead><tbody>` +
    rows.map((x) => `<tr><td class="l">${esc(x.kind)}</td><td class="l">${esc(x.item)}</td><td>${pct(x.f)}</td><td>${pct(x.r)}</td><td>${pct(x.e)}</td><td>${mark(x.ri)}</td><td>${mark(x.ei)}</td></tr>`).join('') +
    '</tbody></table></div>';
}

load();
</script>
